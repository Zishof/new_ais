server:
  port: ${AIS_HTTP_PORT:8081}
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${AIS_SECURE_COOKIE:false}

spring:
  application:
    name: ais-next
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  modulith:
    detection-strategy: explicitly-annotated
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  thymeleaf:
    cache: ${AIS_TEMPLATE_CACHE:true}

management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  otlp:
    metrics:
      export:
        enabled: ${AIS_OTLP_ENABLED:false}

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

ais:
  control:
    enabled: ${AIS_CONTROL_ENABLED:true}
    jdbc-url: ${AIS_CONTROL_DB_URL:jdbc:postgresql://localhost:5432/ais_next_control}
    username: ${AIS_CONTROL_DB_USERNAME:}
    password: ${AIS_CONTROL_DB_PASSWORD:}
    maximum-pool-size: ${AIS_CONTROL_DB_POOL_SIZE:4}
  tenant:
    pool:
      maximum-cached-pools: ${AIS_MAX_CACHED_POOLS:32}
      idle-ttl: ${AIS_POOL_IDLE_TTL:10m}
    local:
      bootstrap: ${AIS_LOCAL_BOOTSTRAP:true}
      tenant-key: ${AIS_LOCAL_TENANT_KEY:local}
      display-name: ${AIS_LOCAL_TENANT_NAME:AIS Local}
      core-jdbc-url: ${AIS_LOCAL_CORE_DB_URL:jdbc:postgresql://localhost:5432/ais}
      file-jdbc-url: ${AIS_LOCAL_FILE_DB_URL:jdbc:postgresql://localhost:5432/streaming_ais}
      credential-reference: ${AIS_LOCAL_CREDENTIAL_REFERENCE:AIS_LOCAL_DB}
      maximum-pool-size: ${AIS_LOCAL_DB_POOL_SIZE:4}
  security:
    handoff:
      issuer: ${AIS_HANDOFF_ISSUER:ais-legacy}
      audience: ${AIS_HANDOFF_AUDIENCE:ais-next}
      signing-key: ${AIS_HANDOFF_SIGNING_KEY:}
